[package]
name = "auth-verifier"
description = "Verifies DPoP-bound access tokens issued by the passkey auth service, using the formally verified auth-core checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# Fetch and cache the issuer's JWKS over HTTPS.
fetch = ["dep:reqwest"]
# An axum extractor for authenticated requests.
axum = ["dep:axum"]

[dependencies]
auth-core.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["sync"] }
reqwest = { workspace = true, optional = true, features = ["rustls", "http2"] }
axum = { workspace = true, optional = true, features = ["original-uri", "json"] }

[dev-dependencies]
auth-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum = { workspace = true, features = ["tokio", "http1"] }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true

[lints]
workspace = true

[[test]]
name = "verify"
required-features = ["axum"]

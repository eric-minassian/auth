[package]
name = "auth-service"
description = "Anonymous, PII-free passkey authentication service (AWS Lambda or local HTTP server)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
auth-core.workspace = true
auth-verifier = { workspace = true, features = ["axum"] }

axum = { workspace = true, features = ["tokio", "http1", "json", "matched-path", "original-uri", "tracing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }
lambda_http = { workspace = true, features = ["apigw_rest", "tracing"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }
http.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
futures.workspace = true
httpdate = "1.0.3"

aws-config = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-kms = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-lc-rs.workspace = true

tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter", "std"] }
thiserror.workspace = true

[dev-dependencies]
auth-core = { workspace = true, features = ["test-support"] }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true

[lints]
workspace = true

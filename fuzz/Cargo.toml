[package]
name = "auth-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
auth-core = { path = "../crates/auth-core", features = ["test-support"] }
serde_json = "1.0.154"

# A separate workspace so the fuzz crate (nightly + sanitizers) never affects
# the main build.
[workspace]
members = ["."]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "encodings"
path = "fuzz_targets/encodings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cbor_cose"
path = "fuzz_targets/cbor_cose.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webauthn"
path = "fuzz_targets/webauthn.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jose"
path = "fuzz_targets/jose.rs"
test = false
doc = false
bench = false
